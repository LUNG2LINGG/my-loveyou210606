<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>20/10 · Cô bé & lời chúc</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Dancing+Script:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#000;-webkit-text-size-adjust:100%}
  body{
    font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
    background:linear-gradient(to bottom,#000 0%,#000 55%,#16051a 82%,#2b0b30 100%);
  }
  #fx{position:fixed;inset:0;z-index:0}
  @media (hover:none){body{cursor:pointer}} /* iOS: để chạm vào nền vẫn nhận sự kiện click */

  /* ---------- cô bé ---------- */
  #girlWrap{
    position:fixed;z-index:2;left:10vw;top:46%;width:min(30vw,400px,48vh);width:min(30vw,400px,48dvh);
    transform:translateY(-55%);
  }
  #aura{
    position:absolute;left:50%;top:50%;width:170%;aspect-ratio:1;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,92,154,.28) 0%,rgba(255,92,154,.10) 35%,transparent 65%);
    animation:aura 4s ease-in-out infinite;pointer-events:none;
  }
  @keyframes aura{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.08)}}
  #girl{position:relative;width:100%;height:auto;display:block;overflow:visible;animation:float 5s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-12px)}}
  #eyes rect,#eyes circle{transform-box:fill-box;transform-origin:center}
  #eyes rect{animation:blink 5.5s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
  #topFlower{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  #fl{transform-box:fill-box;transform-origin:center;transform:scale(.2)}

  /* ---------- 20/10 ---------- */
  #title{
    position:fixed;z-index:1;right:9vw;top:34%;text-align:center;font-family:'Space Mono',ui-monospace,monospace;
    opacity:.1;transition:opacity 1.6s ease,text-shadow 1.6s ease;
  }
  #title .d{font-size:clamp(88px,15vw,210px);font-weight:700;line-height:1;color:#fff;letter-spacing:.02em}
  #title .s{margin-top:10px;font-size:clamp(10px,1.05vw,15px);letter-spacing:.5em;color:#fff;opacity:.75}
  #title.lit{text-shadow:0 0 18px rgba(255,92,154,.75),0 0 50px rgba(255,92,154,.45)}

  /* ---------- lời chạy từng từ ---------- */
  #captionBox{
    position:fixed;z-index:3;left:50%;bottom:calc(12vh + env(safe-area-inset-bottom));bottom:calc(12dvh + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,1000px);
    text-align:center;min-height:3.4em;pointer-events:none;
  }
  #caption{font-family:'Dancing Script','Be Vietnam Pro',cursive;font-size:clamp(25px,3.6vw,46px);font-weight:700;line-height:1.45;transition:opacity .6s ease}
  #caption.out{opacity:0}
  #caption .w{display:inline-block;white-space:pre;opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease}
  #actions{
    position:fixed;z-index:4;left:50%;bottom:calc(4vh + env(safe-area-inset-bottom));bottom:calc(4dvh + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;
    opacity:0;pointer-events:none;transition:opacity 1s ease;
  }
  #actions.show{opacity:1;pointer-events:auto}
  .btn{
    display:inline-block;text-decoration:none;white-space:nowrap;
    border:1px solid rgba(255,255,255,.35);background:rgba(30,8,36,.72);color:#fff;font:inherit;font-size:.95rem;
    padding:11px 22px;border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .btn:active{transform:scale(.96)}
  .btn.main{background:#ff5c9a;border-color:#ff5c9a;box-shadow:0 0 22px rgba(255,92,154,.55)}

  /* ---------- nút ---------- */
  #sound{
    position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:6;width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:1.05rem;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  #water{
    position:fixed;right:0;top:46%;z-index:6;border:none;cursor:pointer;background:#fff;
    padding:9px calc(12px + env(safe-area-inset-right)) 9px 14px;border-radius:22px 0 0 22px;font-size:1.15rem;line-height:1;
    box-shadow:0 0 20px rgba(127,224,255,.5);
  }
  #water:active{transform:scale(.94)}

  /* ---------- màn bắt đầu ---------- */
  #start{
    position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 45%,#2a0a30 0%,#000 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;cursor:pointer;
    transition:opacity 1s ease,visibility 1s;
  }
  #start.gone{opacity:0;visibility:hidden}
  #start .big{font-family:'Space Mono',monospace;font-size:clamp(48px,12vw,100px);font-weight:700;color:#ff7eb6;
    text-shadow:0 0 20px rgba(255,92,154,.8),0 0 60px rgba(255,92,154,.5);animation:pulse 2.4s ease-in-out infinite}
  #start p{margin-top:16px;color:#e9c4d6;line-height:1.5;font-family:'Dancing Script','Be Vietnam Pro',cursive;font-size:1.6rem;font-weight:600}
  #start .tap{margin-top:30px;font-size:.85rem;letter-spacing:.25em;text-transform:uppercase;color:#7dffd6;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}

  #toast{position:fixed;left:50%;bottom:calc(22vh + env(safe-area-inset-bottom));bottom:calc(22dvh + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);background:rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);padding:9px 18px;border-radius:999px;font-size:.82rem;
    opacity:0;transition:.4s;z-index:9;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%)}
  .pop{position:fixed;pointer-events:none;z-index:8;font-size:1.3rem;animation:pop 1.3s ease-out forwards;text-shadow:0 0 10px currentColor}
  @keyframes pop{to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}

  /* ---------- điện thoại ---------- */
  @media (max-width:700px){
    #girlWrap{left:50%;top:27%;width:min(62vw,36vh);width:min(62vw,36dvh);transform:translate(-50%,-50%)}
    #title{right:auto;left:50%;top:52%;transform:translateX(-50%)}
    #title .d{font-size:28vw}
    #captionBox{bottom:calc(15vh + env(safe-area-inset-bottom));bottom:calc(15dvh + env(safe-area-inset-bottom))}
    #caption{font-size:clamp(25px,7vw,33px)}
  }

  /* ---------- iPhone xoay ngang ---------- */
  @media (max-height:500px) and (orientation:landscape){
    #girlWrap{left:10vw;top:42%;width:min(22vw,44vh);width:min(22vw,44dvh);transform:translateY(-55%)}
    #title{left:auto;right:calc(9vw + env(safe-area-inset-right));top:22%;transform:none}
    #title .d{font-size:clamp(64px,14vw,120px)}
    #captionBox{bottom:calc(64px + env(safe-area-inset-bottom))}
    #caption{font-size:clamp(20px,3.2vw,30px)}
    #actions{bottom:calc(10px + env(safe-area-inset-bottom))}
    #toast{bottom:calc(70px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>

  <svg id="girl" viewBox="0 0 240 340" xmlns="http://www.w3.org/2000/svg" aria-label="Cô bé neon">

      <circle cx="184" cy="92" r="19" stroke="#ff7eb6" fill="url(#hairg)"/>

      <!-- tóc sau -->
      <path d="M62 150 C52 80 85 38 120 38 C155 38 188 80 178 150 C176 175 168 195 156 205 C160 180 158 160 150 140 L90 140 C82 160 80 180 84 205 C72 195 64 175 62 150Z"
            stroke="#ff7eb6" fill="url(#hairg)"/>

      <!-- váy -->
      <path d="M92 208 Q120 218 148 208 L172 292 Q120 308 68 292Z" stroke="#ff7eb6" fill="url(#skin)"/>

      <!-- tay hình chiếc lá -->
      <path d="M94 222 C64 212 46 232 48 252 C74 254 92 244 94 222Z" stroke="#7dffd6" fill="rgba(125,255,214,.14)"/>
      <path d="M146 222 C176 212 194 232 192 252 C166 254 148 244 146 222Z" stroke="#7dffd6" fill="rgba(125,255,214,.14)"/>
      <path d="M62 240 Q76 240 90 232" stroke="#7dffd6" stroke-width="1.8" opacity=".7"/>
      <path d="M178 240 Q164 240 150 232" stroke="#7dffd6" stroke-width="1.8" opacity=".7"/>

      <!-- chân -->
      <path d="M104 300 L104 318" stroke="#ff7eb6"/>
      <path d="M136 300 L136 318" stroke="#ff7eb6"/>

      <!-- mặt -->
      <ellipse cx="120" cy="142" rx="52" ry="50" stroke="#ff7eb6" fill="url(#skin)"/>

      <!-- mái tóc -->
      <path d="M66 130 C70 78 170 78 174 130 C156 114 140 112 120 94 C100 112 84 114 66 130Z" stroke="#ff7eb6" fill="url(#hairg)"/>

      <!-- mắt -->
      <g id="eyes" stroke="none" fill="#ffe6f2">
        <rect x="92" y="134" width="18" height="30" rx="9"/>
        <rect x="130" y="134" width="18" height="30" rx="9"/>
        <circle cx="99" cy="142" r="3.2" fill="#fff"/>
        <circle cx="137" cy="142" r="3.2" fill="#fff"/>
      </g>

      <!-- má hồng -->
      <ellipse cx="86" cy="171" rx="11" ry="6" fill="#ff5c9a" stroke="none" opacity=".55"/>
      <ellipse cx="154" cy="171" rx="11" ry="6" fill="#ff5c9a" stroke="none" opacity=".55"/>

      <!-- miệng -->
      <path id="mouth" d="M112 177 Q120 185 128 177" stroke="#ffe6f2" stroke-width="3"/>

      <!-- bông hoa trên đầu -->

        <path d="M120 41 C120 36 120 31 120 27" stroke="#7dffd6"/>
        <path d="M120 36 C113 36 108 32 106 27 C113 26 118 30 120 36Z" stroke="#7dffd6" fill="rgba(125,255,214,.14)" stroke-width="2.4"/>
        <g stroke-width="2.6">
          <circle cx="120" cy="12" r="6" stroke="#ff9ccf" fill="rgba(255,156,207,.35)"/>
          <circle cx="127.5" cy="17.5" r="6" stroke="#ff9ccf" fill="rgba(255,156,207,.35)"/>
          <circle cx="124.6" cy="26.3" r="6" stroke="#ff9ccf" fill="rgba(255,156,207,.35)"/>
          <circle cx="115.4" cy="26.3" r="6" stroke="#ff9ccf" fill="rgba(255,156,207,.35)"/>
          <circle cx="112.5" cy="17.5" r="6" stroke="#ff9ccf" fill="rgba(255,156,207,.35)"/>

      </g>

      <!-- bông hoa cài tóc (lớn dần) -->
      <g transform="translate(160 62)">
        <g id="fl" stroke-width="2.6">
          <circle cx="0" cy="-10" r="6.5" stroke="#ff9ccf" fill="rgba(255,156,207,.35)"/>
          <circle cx="9.5" cy="-3" r="6.5" stroke="#ff9ccf" fill="rgba(255,156,207,.35)"/>
          <circle cx="5.9" cy="8" r="6.5" stroke="#ff9ccf" fill="rgba(255,156,207,.35)"/>
          <circle cx="-5.9" cy="8" r="6.5" stroke="#ff9ccf" fill="rgba(255,156,207,.35)"/>
          <circle cx="-9.5" cy="-3" r="6.5" stroke="#ff9ccf" fill="rgba(255,156,207,.35)"/>
          <circle cx="0" cy="0" r="4.4" stroke="#ffb347" fill="#ffd36e"/>
        </g>
      </g>
    </g>
  </svg>
</div>

<!-- ================= CHỮ ================= -->
<div id="title">
  <div class="d">20/10</div>
</div>

<div id="captionBox"><div id="caption"></div></div>

<div id="actions">
  <a class="btn main" id="gift" href="qua.html">🎁 Chọn quà</a>
  <button class="btn" id="replay">Xem lại</button>
</div>

<button id="sound" aria-label="Bật/tắt âm thanh">🔇</button>
<button id="water" aria-label="Tưới nước cho bé">💧</button>
<div id="toast"></div>

<div id="start">
  <div class="big">20/10</div>
  <p>Có một lời chúc nhỏ<br>dành cho cậu.</p>
  <div class="tap">Chạm để bắt đầu</div>
  <p style="font-size:1.1rem;margin-top:14px;opacity:.7">Bật âm thanh để nghe trọn vẹn nhé.</p>
</div>

<script>
(function(){
  /* =========================================================
     NỘI DUNG LỜI CHÚC
  ========================================================= */
  // Đổi cách xưng hô ở đây (ví dụ ME="mình", YOU="cậu" hoặc tên người ấy)
  const ME="anh", YOU="em";
  const lines=[
    `20/10 — Ngày cả nước nói lời cảm ơn những người phụ nữ.`,
    `Nhưng hôm nay, ${ME} muốn nói riêng với một người ♥`,
    `Người đã đến bên ${ME}, và làm những ngày bình thường trở nên đáng nhớ.`,
    `Cảm ơn ${YOU} vì đã lo cho ${ME}, dù đôi khi chính ${YOU} cũng đang mệt ☾`,
    `Cảm ơn ${YOU} vì nhớ những điều nhỏ xíu mà ${ME} hay quên ✿`,
    `Cảm ơn ${YOU} vì nụ cười làm cả một ngày dài nhẹ đi ☀`,
    `${YOU.charAt(0).toUpperCase()+YOU.slice(1)} có thể không nhận ra, nhưng ${YOU} là điều đẹp nhất trong những ngày của ${ME} ✦`,
    `Mong ${YOU} luôn được yêu thương đúng như cách ${YOU} đã yêu thương người khác ♡`,
    `Chúc mừng ngày Phụ nữ Việt Nam 20/10, người phụ nữ của ${ME}.`,
    `Mong mỗi ngày của ${YOU} đều có hoa, có nắng, có tiếng cười — và có ${ME} ở bên cạnh ♥`
  ];

  /* =========================================================
     CANVAS: sao · cánh hoa · hoa neon · giọt nước
  ========================================================= */
  const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
  let W,H,dpr, stars=[], petals=[], blades=[], drops=[], rings=[], shoots=[];
  const ptr={x:-999,y:-999};
  const STEM=['#3ef2a0','#00f5d4','#7cf29a','#4cd9a8'];
  const BLOOM=['#ff5c9a','#ff9ccf','#ffd36e','#b388ff','#ff8fb8','#ffa8d0','#ffffff','#4cc9f0'];
  const PETAL=['#ff8fb8','#ffc27a','#b69cff','#ffa8d0'];

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    const big=!W||innerWidth!==W||Math.abs(innerHeight-H)>150; // thanh địa chỉ Safari co/giãn thì không tạo lại nền
    W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(big){ initStars(); initGrass(); initPetals(); }
  }
  function initStars(){
    const n=Math.round(W*H/5500); stars=[];
    for(let i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H*.88,r:Math.random()*1.3+.3,ph:Math.random()*6.28,sp:.5+Math.random()*1.5,
      c:['#ffffff','#cfe8ff','#ffe3f0','#fff3c4'][i%4]});
  }
  function initGrass(){
    const gh=Math.max(50,H*.115), n=Math.round(W/9); blades=[];
    for(let i=0;i<n;i++) blades.push({x:Math.random()*W,h:gh*(.4+Math.random()*.7),
      sc:STEM[(Math.random()*STEM.length)|0],pc:BLOOM[(Math.random()*BLOOM.length)|0],
      ph:Math.random()*6.28,sp:.8+Math.random()*1.2,w:1.2+Math.random()*1,r:7+Math.random()*6,
      leaf:.3+Math.random()*.3,side:Math.random()<.5?-1:1,petals:5+((Math.random()*3)|0)});
  }
  function initPetals(){
    petals=[]; const n=W<700?16:28;
    for(let i=0;i<n;i++) petals.push(newPetal(true));
  }
  function newPetal(anywhere){
    return {x:Math.random()*W,y:anywhere?Math.random()*H:-20-Math.random()*60,s:5+Math.random()*7,vy:.5+Math.random()*.9,
      ph:Math.random()*6.28,sp:.6+Math.random()*1.0,rot:Math.random()*6.28,vr:(Math.random()-.5)*.03,c:PETAL[(Math.random()*PETAL.length)|0]};
  }

  function frame(ts){
    const t=ts/1000;
    ctx.clearRect(0,0,W,H);

    // sao
    for(const s of stars){
      const a=.35+.65*Math.abs(Math.sin(t*s.sp+s.ph));
      ctx.globalAlpha=a; ctx.fillStyle=s.c;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;

    // sao băng
    if(Math.random()<.003 && shoots.length<2) shoots.push({x:Math.random()*W*.8+W*.2,y:Math.random()*H*.3,vx:-6-Math.random()*4,vy:2.5+Math.random()*2,l:1});
    for(let i=shoots.length-1;i>=0;i--){
      const s=shoots[i]; s.x+=s.vx; s.y+=s.vy; s.l-=.014;
      if(s.l<=0){shoots.splice(i,1);continue}
      const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*8,s.y-s.vy*8);
      g.addColorStop(0,'rgba(255,255,255,'+s.l+')'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=g; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*8,s.y-s.vy*8); ctx.stroke();
    }

    // cánh hoa
    const wind=Math.sin(t*.4)*.6;
    for(const p of petals){
      p.y+=p.vy; p.x+=Math.sin(t*p.sp+p.ph)*.7+wind; p.rot+=p.vr;
      if(p.y>H+20||p.x<-30||p.x>W+30){Object.assign(p,newPetal(false))}
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot+Math.sin(t*p.sp+p.ph)*.5);
      ctx.scale(1,.55+.45*Math.abs(Math.cos(t*p.sp+p.ph)));
      ctx.globalAlpha=.92; ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.ellipse(0,0,p.s*.58,p.s,0,0,6.283); ctx.fill();
      ctx.globalAlpha=.45; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.ellipse(-p.s*.12,-p.s*.3,p.s*.16,p.s*.38,0,0,6.283); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;

    // hoa neon
    ctx.lineCap='round';
    const gwind=Math.sin(t*.7)*5;
    for(const b of blades){
      let bend=Math.sin(t*b.sp+b.ph)*b.h*.16+gwind;
      const dx=b.x-ptr.x, dy=(H-b.h*.5)-ptr.y;
      if(Math.abs(dx)<110 && Math.abs(dy)<b.h*1.3+60){ bend+=Math.sign(dx)*(1-Math.abs(dx)/110)*b.h*.65; }
      const tx=b.x+bend, ty=H-b.h;
      // thân + lá
      ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle=b.sc; ctx.globalAlpha=.75; ctx.lineWidth=b.w;
      ctx.beginPath(); ctx.moveTo(b.x,H+2);
      ctx.quadraticCurveTo(b.x+bend*.35,H-b.h*.6,tx,ty); ctx.stroke();
      const lt=b.leaf, lx=b.x+bend*.35*lt*1.4, ly=H-b.h*lt;
      ctx.globalAlpha=.55; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(lx,ly);
      ctx.quadraticCurveTo(lx+b.side*b.r*1.4,ly-b.r*1.6,lx+b.side*b.r*2.2,ly-b.r*.6);
      ctx.quadraticCurveTo(lx+b.side*b.r*1.2,ly-b.r*.2,lx,ly); ctx.stroke();
      // quầng sáng
      const g=ctx.createRadialGradient(tx,ty,0,tx,ty,b.r*2.4);
      g.addColorStop(0,b.pc); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=.28; ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(tx,ty,b.r*2.4,0,6.283); ctx.fill();
      // cánh hoa
      ctx.globalCompositeOperation='source-over';
      const rot=Math.sin(t*b.sp+b.ph)*.25+bend*.01;
      ctx.fillStyle=b.pc; ctx.globalAlpha=.88;
      for(let k=0;k<b.petals;k++){
        const an=rot+k*6.283/b.petals;
        ctx.beginPath(); ctx.ellipse(tx+Math.cos(an)*b.r*.85,ty+Math.sin(an)*b.r*.85,b.r*.85,b.r*.5,an,0,6.283); ctx.fill();
      }
      // nhụy
      ctx.globalAlpha=1; ctx.fillStyle='#ffd36e';
      ctx.beginPath(); ctx.arc(tx,ty,b.r*.42,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

    // giọt nước
    for(let i=drops.length-1;i>=0;i--){
      const d=drops[i]; d.y+=d.vy; d.vy+=.12;
      if(d.y>=d.ty){ rings.push({x:d.x,y:d.ty,r:2,a:.9}); drops.splice(i,1); continue }
      ctx.fillStyle='#8fe6ff'; ctx.shadowColor='#8fe6ff'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.ellipse(d.x,d.y,2.4,4.2,0,0,6.283); ctx.fill(); ctx.shadowBlur=0;
    }
    for(let i=rings.length-1;i>=0;i--){
      const r=rings[i]; r.r+=1.1; r.a-=.04;
      if(r.a<=0){rings.splice(i,1);continue}
      ctx.strokeStyle='rgba(143,230,255,'+r.a+')'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.ellipse(r.x,r.y,r.r*1.6,r.r*.6,0,0,6.283); ctx.stroke();
    }

    // bông hoa lớn dần
    flowerS+=(flowerT-flowerS)*.03;
    flEl.style.transform='scale('+(.2+.95*flowerS).toFixed(3)+')';

    requestAnimationFrame(frame);
  }

  /* =========================================================
     CÔ BÉ: mắt nhìn theo con trỏ · hoa · biểu cảm
  ========================================================= */
  const flEl=document.getElementById('fl');
  const eyes=document.getElementById('eyes');
  const mouth=document.getElementById('mouth');
  const girlWrap=document.getElementById('girlWrap');
  let flowerS=0, flowerT=0, bonus=0;

  function onMove(x,y){
    ptr.x=x; ptr.y=y;
    const r=girlWrap.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height*.42;
    const dx=Math.max(-1,Math.min(1,(x-cx)/(W*.4))), dy=Math.max(-1,Math.min(1,(y-cy)/(H*.4)));
    eyes.style.transform='translate('+(dx*5).toFixed(1)+'px,'+(dy*4).toFixed(1)+'px)';
  }
  addEventListener('pointermove',e=>onMove(e.clientX,e.clientY));
  addEventListener('pointerdown',e=>onMove(e.clientX,e.clientY));
  addEventListener('pointerleave',()=>{ptr.x=ptr.y=-999});
  addEventListener('pointerup',e=>{if(e.pointerType==='touch')ptr.x=ptr.y=-999});
  addEventListener('pointercancel',()=>{ptr.x=ptr.y=-999});

  const SMILE='M112 177 Q120 185 128 177', HAPPY='M110 175 Q120 192 130 175 Z';
  function happy(ms){
    mouth.setAttribute('d',HAPPY); mouth.setAttribute('fill','#ff5c9a');
    setTimeout(()=>{mouth.setAttribute('d',SMILE); mouth.setAttribute('fill','none')},ms||1600);
  }

  function burst(x,y,chars,n){
    chars=chars||['♥','✿','✦']; n=n||8;
    for(let i=0;i<n;i++){
      const s=document.createElement('div'); s.className='pop'; s.textContent=chars[i%chars.length];
      s.style.left=x+'px'; s.style.top=y+'px'; s.style.color=['#ff5c9a','#ff9ccf','#ffd36e','#7dffd6'][i%4];
      s.style.setProperty('--x',(Math.random()*260-130)+'px'); s.style.setProperty('--y',(-50-Math.random()*190)+'px');
      document.body.appendChild(s); setTimeout(()=>s.remove(),1400);
    }
  }
  function girlCenter(){ const r=girlWrap.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height*.4,top:r.top,w:r.width}; }

  /* =========================================================
     ÂM THANH (WebAudio, không cần file ngoài)
  ========================================================= */
  let actx=null, soundOn=false, padTimer=null;
  const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
  const CHORDS=[[130.81,196,261.63,329.63],[110,164.81,220,261.63],[87.31,130.81,174.61,261.63],[98,146.83,196,246.94]];
  let chordI=0;
  function ensureAudio(){
    if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(actx&&actx.state==='suspended')actx.resume();
  }
  function tone(f,when,dur,vol,type,attack){
    if(!soundOn||!actx)return;
    const t=actx.currentTime+when, o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(attack||.02));
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.05);
  }
  function chime(i){ tone(PENTA[i%PENTA.length],0,1.8,.09); tone(PENTA[(i+2)%PENTA.length],.18,1.8,.06); }
  function arpeggio(){ [0,2,4,5].forEach((n,i)=>tone(PENTA[n],i*.15,2.2,.1)); }
  function pad(){
    const ch=CHORDS[chordI++%CHORDS.length];
    ch.forEach(f=>tone(f,0,6.5,.035,'triangle',2));
  }
  function startPad(){ stopPad(); if(!soundOn)return; pad(); padTimer=setInterval(pad,5500); }
  function stopPad(){ if(padTimer){clearInterval(padTimer);padTimer=null} }

  const soundBtn=document.getElementById('sound');
  soundBtn.addEventListener('click',e=>{
    e.stopPropagation(); ensureAudio(); soundOn=!soundOn;
    soundBtn.textContent=soundOn?'🔊':'🔇';
    if(soundOn){arpeggio();startPad()} else stopPad();
  });
  // iPhone: tắt tiếng khi chuyển app / khoá màn hình, bật lại khi quay về
  document.addEventListener('visibilitychange',()=>{
    if(!actx) return;
    if(document.hidden){ stopPad(); if(actx.suspend) actx.suspend(); }
    else if(soundOn){ if(actx.resume) actx.resume(); startPad(); }
  });

  /* =========================================================
     MÁY GÕ CHỮ TỪNG TỪ
  ========================================================= */
  const caption=document.getElementById('caption');
  const titleEl=document.getElementById('title');
  const actions=document.getElementById('actions');
  let li=0, words=[], wi=0, timer=null, typing=false, started=false;

  function paint(){
    const spans=caption.children;
    for(let j=0;j<spans.length;j++){
      const age=spans.length-1-j;
      spans[j].style.opacity=age===0?.3:age===1?.62:1;
      spans[j].style.transform='none';
    }
  }
  function addWord(){
    const sp=document.createElement('span'); sp.className='w'; sp.textContent=words[wi]+(wi<words.length-1?' ':'');
    caption.appendChild(sp); wi++;
    requestAnimationFrame(()=>requestAnimationFrame(paint));
  }
  function playLine(i){
    clearTimeout(timer); li=i;
    caption.classList.remove('out'); caption.innerHTML='';
    words=lines[i].split(' '); wi=0; typing=true;
    react(i);
    (function step(){
      if(wi>=words.length){
        typing=false;
        if(i===lines.length-1){ finish(); return; }
        timer=setTimeout(next,2000+words.length*70); return;
      }
      addWord();
      const w=words[wi-1];
      timer=setTimeout(step,w.length>7?260:200);
    })();
  }
  function next(){
    clearTimeout(timer);
    if(li>=lines.length-1) return;
    caption.classList.add('out');
    timer=setTimeout(()=>playLine(li+1),550);
  }
  function skip(){
    if(!started) return;
    if(typing){
      clearTimeout(timer);
      while(wi<words.length) addWord();
      typing=false;
      if(li===lines.length-1){ finish(); return; }
      timer=setTimeout(next,1500);
    } else next();
  }
  function react(i){
    const p=(i+1)/lines.length;
    flowerT=Math.min(1,p*.82+bonus);
    titleEl.style.opacity=Math.min(1,.1+p*.95).toFixed(2);
    if(i>=1) titleEl.classList.add('lit');
    chime(i);
    if(i===1){ happy(2200); const g=girlCenter(); burst(g.x,g.y,['♥','✦'],8); }
    if(i===lines.length-1){ flowerT=1; }
  }
  function finish(){
    flowerT=1; happy(4000); arpeggio();
    const g=girlCenter(); burst(g.x,g.y,['♥','✿','✦','❀'],20);
    setTimeout(()=>burst(innerWidth/2,innerHeight*.5,['♥','✿','✦'],18),700);
    setTimeout(()=>actions.classList.add('show'),1800);
  }

  /* =========================================================
     SỰ KIỆN
  ========================================================= */
  const startEl=document.getElementById('start');
  startEl.addEventListener('click',()=>{
    ensureAudio(); soundOn=true; soundBtn.textContent='🔊'; arpeggio(); startPad();
    startEl.classList.add('gone'); started=true;
    setTimeout(()=>playLine(0),900);
    setTimeout(()=>toast('Chạm 💧 bên phải để tưới nước cho bé nhé'),9000);
  });

  document.addEventListener('click',e=>{
    if(!started||e.target.closest('button,a')||startEl.contains(e.target)) return;
    burst(e.clientX,e.clientY,['♥'],3);
    skip();
  });

  document.getElementById('water').addEventListener('click',e=>{
    e.stopPropagation();
    if(!started) return;
    const g=girlCenter();
    for(let i=0;i<14;i++) drops.push({x:g.x+(Math.random()-.5)*g.w*.7,y:g.top-130-Math.random()*90,vy:1+Math.random()*2,ty:g.top+g.w*.12});
    bonus=Math.min(.18,bonus+.04);
    flowerT=Math.min(1,flowerT+.05);
    happy(1800); chime(3);
    setTimeout(()=>burst(g.x,g.y-20,['✦','♥'],6),600);
  });

  document.getElementById('replay').addEventListener('click',e=>{
    e.stopPropagation(); actions.classList.remove('show');
    flowerT=0; bonus=0; titleEl.style.opacity=.1; titleEl.classList.remove('lit');
    playLine(0);
  });

  document.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='ArrowRight'||e.key==='Enter') skip(); });

  let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

  addEventListener('resize',resize);
  resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
